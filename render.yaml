services:
  - type: web
    name: bypass-city
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        generateValue: true
      # Canonical public URL of this service (e.g. https://bypass-city.lol).
      # Used to build the Telegram login widget's callback URL from a trusted
      # value instead of client-controllable Host headers.
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      # Email of the account that should always be treated as admin
      # (in addition to any user whose role is set to 'admin' via
      # make-admin.js). Referenced by server.js but was missing here before.
      - key: ADMIN_EMAIL
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
    # No persistent disk needed: file uploads live in Cloudinary and all
    # app data (including sessions, as of this change) lives in Turso. The
    # previous `disk`/DATA_DIR config was unused dead weight — DATA_DIR was
    # never read anywhere in the code. If you already have a live disk
    # attached on Render, remove it manually from the service's dashboard
    # after deploying (render.yaml alone won't detach an existing disk).
